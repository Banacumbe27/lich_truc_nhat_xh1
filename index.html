<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trực nhật hôm nay</title>
    <style>
       
        body {
            overflow-x: hidden;
            font-family: Arial, sans-serif;
            background: url(background.png);
            background-size: cover;
            background-position: 50% 50%;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        h1 {
            text-align: center;
            font-size: 4vmax;
        }
        h1 a {
            font-size: 2vmax;
            text-decoration: none;
            color: #333;
        }
        .duty-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            text-align: center;
            width: fit-content;
        }
        .duty-group {
            padding: 20px;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }
        h2 {
            font-size: 2.5vmax;
            color: #4CAF50;
            margin: 0;
        }
        .duty-title {
            font-size: 3vmax;
            color: #333;
            margin-bottom: 20px;
        }

        /* Media query for mobile */
        @media (max-width: 600px) {
            .duty-container {
                grid-template-columns: 1fr;
                width: 100%;
            }
            h1 {
                font-size: 6vmax;
            }
            h1 a {
                font-size: 4vmax;
            }
            h2 {
                font-size: 5vmax;
            }
            .duty-title {
                font-size: 5vmax;
            }
            .duty-group {
                padding: 30px;
            }
        }
    </style>
</head>
<body>
<h1><a href="trucnhat_table.html" target="_blank">Xem danh sách trực nhật full tại đây</a></h1>
<div class="duty-container">
    <div class="duty-group">
        <h2 class="duty-title">Nhóm trực nhật nữ</h2>
        <h2 id="girlDuty">Loading...</h2>
    </div>
    <div class="duty-group">
        <h2 class="duty-title">Nhóm trực nhật nam</h2>
        <h2 id="boyDuty">Loading...</h2>
    </div>
</div>

<script>
    const dayOfWeek = ["Thứ hai", "Thứ ba", "Thứ tư", "Thứ năm", "Thứ sáu"];
    const all_dayOfWeek = ["Chủ Nhật", "Thứ hai", "Thứ ba", "Thứ tư", "Thứ năm", "Thứ sáu", "Thứ bảy"];
    const girlGroups = [
        ["Nguyễn Minh Ánh", "Huỳnh Lê Ngân Giang"],
        ['Lê Hồng Hạnh', 'Nguyễn Ngọc Hân'],
        ['Đỗ Như Xuân Hoàng', 'Hà Quỳnh Hương'],
        ['Nguyễn Minh Khuê', 'Lại Khánh Vân Lam'],
        ['Đào Thảo Linh', 'Trần Phạm Phương Linh'],
        ['Đặng Minh Ngân', 'Hoàng Chân Như'],
        ['Lê Thanh Phương', 'Vũ Nguyễn Trúc Quân'],
        ['Ngô Anh Thư', 'Võ Bảo Trân \n Huỳnh Trần Thanh Trúc']
    ];
    const boyGroups = [
        ['Trần Hoàng Bách', 'Nguyễn Lê Minh Duy', 'Nguyễn Thế Gia Huy', 'Trịnh Tuấn Hưng', 'Hồ Minh Khang'],
        ['Thái Quang Khang', 'Phạm Nguyễn Đăng Khoa', 'Lê Nguyên Khôi', 'Đinh Thiện Nhân', 'Huỳnh Trần Phúc Nguyên'],
        ['Đặng Tấn Phát', 'Nguyễn Đình Thiên Phước', 'Nguyễn Công Minh Quang', 'Nguyễn Tấn Tri', 'Huỳnh Phúc Quang Tuân \n Nguyễn Phạm Quang Vinh'],
    ];

    let startDate = new Date("2024-10-18");
    let endDate = new Date("2025-06-30");
    let currentDate = new Date(); 
    let schedule = [];

    // Special case for September 13, 2024
    let specialDate = new Date("2024-09-13");

    let tempDate = new Date(startDate);
    document.querySelector('h1').textContent = `${all_dayOfWeek[currentDate.getDay()]}, ${currentDate.getDate()}/${currentDate.getMonth()+1}/${currentDate.getFullYear()}`;
    
    while (tempDate <= endDate) {
        if (tempDate.getDay() >= 1 && tempDate.getDay() <= 5) {  // Monday to Friday
            let girlPair = girlGroups.shift();
            let boyGroup = boyGroups[0];  // Keep the same boy group for the week
            schedule.push({
                date: new Date(tempDate),
                girlPair: girlPair,
                boyGroup: boyGroup
            });
            girlGroups.push(girlPair);  // Re-append pair to end of list
            if (tempDate.getDay() === 5) {  // Only shift boy group on Fridays
                boyGroups.push(boyGroups.shift());
            }
        }
        tempDate.setDate(tempDate.getDate() + 1);
    }

    // Function to check if two dates are the same (ignoring time)
    function sameDay(d1, d2) {
        return d1.getFullYear() === d2.getFullYear() &&
               d1.getMonth() === d2.getMonth() &&
               d1.getDate() === d2.getDate();
    }

    let today_girl = null;
    let today_boy = null;
    let isWeekend = currentDate.getDay() === 6 || currentDate.getDay() === 0;  // 6 = Saturday, 0 = Sunday

    let girlDutyElement = document.getElementById("girlDuty");
    let boyDutyElement = document.getElementById("boyDuty");

    if (sameDay(currentDate, specialDate)) {
        girlDutyElement.innerText = "!Hôm nay thầy trực. Web này sẽ tính người trực nhật từ Thứ hai ngày 16/9!";
        boyDutyElement.innerText = "!Hôm nay thầy trực. Web này sẽ tính người trực nhật từ Thứ hai ngày 16/9!";
    } else if (isWeekend) {
        girlDutyElement.innerText = "Chúc bạn cuối tuần vui vẻ, tuần sau nhớ trực nhật đầy đủ nhé.";
        boyDutyElement.innerText = "Chúc bạn cuối tuần vui vẻ, tuần sau nhớ trực nhật đầy đủ nhé.";
    } else {
        // Loop through the schedule to find today's pair
        for (let entry of schedule) {
            if (sameDay(entry.date, currentDate)) {
                today_girl = entry.girlPair;
                today_boy = entry.boyGroup;
                break;
            }
        }

        // Update the webpage with today's cleaning duty students or a default message
        if (today_girl) {
            girlDutyElement.innerText = ` ${today_girl[0]} \n ${today_girl[1]} `;
        } else {
            girlDutyElement.innerText = "!Không có người trực hôm nay!";
        }

        // Only show the boys' group on Fridays
        if (currentDate.getDay() === 5 && today_boy) {
            boyDutyElement.innerText = ` ${today_boy.join("\n ")} `;
        } else {
            boyDutyElement.innerText = "Nhóm trực nam chỉ trực vào thứ Sáu";
        }
    }
</script>

</body>
</html>
